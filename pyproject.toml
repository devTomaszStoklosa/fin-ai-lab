[project]
name = "fin-ai-lab"
version = "0.1.0"
description = "Laboratorium nauki AI engineeringu na danych z rynków finansowych"
readme = "README.md"
authors = [
    { name = "Tomasz", email = "tomaszstoklosa1990@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
fin-ai-lab = "fin_ai_lab.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: requires network access and a real GEMINI_API_KEY, skipped by default",
]

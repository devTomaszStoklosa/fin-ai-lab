# Lint, format and tests on every push to main and every pull request. Tests run
# on Linux and on Windows (the development machine), offline: live tests are
# deselected by default (pyproject.toml) and CI has no API keys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The same extras as the tests, so the optional libraries' types resolve.
      # herbert and quantized (PyTorch, llama.cpp) are left out: the few
      # imports from them carry a targeted pyright ignore.
      - run: uv sync --locked --extra portfolio --extra rag --extra pulse --extra ml --extra groq --extra ui
      - run: uv run pyright

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Every extra except herbert and quantized (PyTorch, llama.cpp): those are
      # only for local P4 inference and their tests skip without them.
      - run: uv sync --locked --extra portfolio --extra rag --extra pulse --extra ml --extra groq --extra ui
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
